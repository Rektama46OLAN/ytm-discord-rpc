<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="960" height="360" rx="14" fill="#14171f"/>

  <!-- Chrome / PWA -->
  <rect x="24" y="40" width="330" height="280" rx="12" fill="#1c2130" stroke="#2f3750"/>
  <text x="44" y="68" fill="#e6e9f2" font-size="15" font-weight="700">Chrome — YouTube Music (PWA)</text>
  <rect x="44" y="86" width="290" height="62" rx="8" fill="#26304a"/>
  <text x="58" y="110" fill="#ffb86b" font-size="13" font-weight="700">main.js  (MAIN world)</text>
  <text x="58" y="130" fill="#aab3cc" font-size="12">movie_player.getVideoData() → video id</text>
  <rect x="44" y="158" width="290" height="70" rx="8" fill="#26304a"/>
  <text x="58" y="182" fill="#7ee0a8" font-size="13" font-weight="700">content.js  (isolated world)</text>
  <text x="58" y="202" fill="#aab3cc" font-size="12">mediaSession + &lt;video&gt; + player-bar DOM</text>
  <text x="58" y="218" fill="#aab3cc" font-size="12">title · artist · cover · position · paused</text>
  <rect x="44" y="238" width="290" height="62" rx="8" fill="#26304a"/>
  <text x="58" y="262" fill="#8ab4ff" font-size="13" font-weight="700">background.js  (service worker)</text>
  <text x="58" y="282" fill="#aab3cc" font-size="12">fetch → http://127.0.0.1:17463</text>

  <!-- Bridge -->
  <rect x="404" y="90" width="260" height="180" rx="12" fill="#1c2130" stroke="#2f3750"/>
  <text x="424" y="118" fill="#e6e9f2" font-size="15" font-weight="700">Local bridge (Node.js)</text>
  <text x="424" y="146" fill="#aab3cc" font-size="12">HTTP server on 127.0.0.1 only</text>
  <text x="424" y="168" fill="#aab3cc" font-size="12">POST /presence · POST /clear</text>
  <text x="424" y="196" fill="#aab3cc" font-size="12">builds the activity (type Listening,</text>
  <text x="424" y="214" fill="#aab3cc" font-size="12">timestamps, button) and clears it on</text>
  <text x="424" y="232" fill="#aab3cc" font-size="12">pause / tab close / 30 s of silence</text>
  <text x="424" y="256" fill="#ffb86b" font-size="12" font-weight="700">@xhayper/discord-rpc</text>

  <!-- Discord -->
  <rect x="714" y="90" width="222" height="180" rx="12" fill="#1c2130" stroke="#2f3750"/>
  <text x="734" y="118" fill="#e6e9f2" font-size="15" font-weight="700">Discord</text>
  <text x="734" y="146" fill="#aab3cc" font-size="12">desktop app, local IPC pipe</text>
  <rect x="734" y="166" width="182" height="84" rx="8" fill="#2b2d31"/>
  <text x="746" y="188" fill="#e6e9f2" font-size="12" font-weight="700">YouTube Music dinliyor</text>
  <text x="746" y="208" fill="#cfd3dc" font-size="12">Song title</text>
  <text x="746" y="224" fill="#9aa1b2" font-size="11">Artist · progress bar</text>
  <rect x="746" y="232" width="158" height="12" rx="6" fill="#3a3d44"/>

  <!-- arrows -->
  <line x1="354" y1="180" x2="400" y2="180" stroke="#8b93a7" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="664" y1="180" x2="710" y2="180" stroke="#8b93a7" stroke-width="2" marker-end="url(#arr)"/>
  <text x="357" y="170" fill="#8b93a7" font-size="11">HTTP</text>
  <text x="668" y="170" fill="#8b93a7" font-size="11">IPC</text>

  <text x="480" y="340" text-anchor="middle" fill="#6f7791" font-size="12">Everything stays on your machine — only Discord receives the presence.</text>
</svg>
